# main に保存（push）されたら：自動チェック → サイトを作る → GitHub Pages に公開
# 提案（Pull Request）が来たら：自動チェックだけ行い、結果を表示
name: チェックして公開
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 自動チェック（計算・表示・リンク・共有）
        run: npm test
      - name: 更新したページを調べる（IndexNow 用）
        id: indexnow
        if: github.event_name != 'pull_request'
        run: node scripts/indexnow.js diff
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    # 公開が終わったら、増えた・更新したページを Bing などに知らせる（失敗しても公開には影響しない）
    if: github.event_name != 'pull_request' && needs.build.outputs.urls != '' && needs.build.outputs.urls != '[]'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IndexNow に送る
        env:
          URLS: ${{ needs.build.outputs.urls }}
        run: node scripts/indexnow.js send
