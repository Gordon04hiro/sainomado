# 地価公示・地価調査のデータの形を確かめる（試し用。手動で実行）
name: 地価データの確認
on:
  workflow_dispatch:
  push:
    branches: [souba-trend]
    paths: [scripts/chika-probe.sh, .github/workflows/chika-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/chika-probe.sh
