# ==============================================================
#  テーマごとのまとめページ（ガイド）
#  手順ごとに、使うツールと読む記事を並べます。記事はファイル名（.md を除く）で書きます。
#  ツールは lifeplan／sell／loan／rent2buy／prepay／souzoku／souzoku2／souzokuzei／akiya／vs
# ==============================================================
buy:
  タイトル: 家を買う前に読むガイド
  検索タイトル: 家を買う前に読むガイド｜予算・ローン・買ったあとのお金
  カテゴリ: 家を買う
  イラスト: buy
  リード: 予算の決め方から、住宅ローンの選び方、買ったあとにかかり続けるお金まで。家を買う前に確かめておきたいことを、順番にまとめました。
  本文:
    - 家を買うときに一番大切なのは、「いくらまでなら買っても暮らしが続くか」を先に決めることです。物件を見始めると、気に入った家に合わせて予算が少しずつ上がりがちです。先に予算の上限を決めておけば、物件選びで迷いにくくなります。
    - 予算の考え方には3つの段階があります。銀行の審査で「借りられる額」、毎月の返済が手取りの4分の1ほどに収まる「無理なく返せる額」、そして教育費や老後のお金まで含めて95歳まで家計が続く「家計全体で見た上限」です。サイのまどの住宅ローン・購入予算診断では、この3つを並べて、いちばん小さい額をおすすめの予算として出します。
    - このガイドでは、予算を決める → 住宅ローンを選ぶ → 買ったあとのお金を知る → 家計全体で確かめる、の順に、使うツールと読む記事を並べました。上から順に進めると、契約の前に確かめておきたいことがひと通りそろいます。
  手順:
    - 見出し: 予算を決める
      説明: 「審査で借りられる額」と「無理なく返せる額」は違います。年収や今の家賃から、無理のない予算の目安を出してみましょう。
      ツール: [loan, rent2buy]
      記事: [loan-budget, loan-hayami, tedori-hayami, rent-same-buy]
    - 見出し: 住宅ローンを選ぶ
      説明: 金利のタイプや、住宅ローン控除のしくみを知っておくと、借り方の判断がしやすくなります。
      ツール: [vs, koujo, zoyo, chuko]
      記事: [hendo-kotei, loan-koujo, pair-loan, chuko-yasui-riyu]
    - 見出し: 買ったあとのお金を知る
      説明: 固定資産税や修繕費は、家を持っているかぎりかかり続けます。繰上げ返済や借り換えの考え方も確認しておきましょう。
      ツール: [prepay]
      記事: [koteishisanzei, prepay-which, karikae]
    - 見出し: 家計全体で確かめる
      説明: 教育費や老後まで続けて見ると、本当に無理がないかがわかります。
      ツール: [lifeplan]
      記事: [kyouikuhi]
sell:
  タイトル: 家を売る・住み替えるときのガイド
  検索タイトル: 家を売る・住み替えるときのガイド｜手取り・進め方・必要書類
  カテゴリ: 家を売る
  イラスト: sell
  リード: 家を売ると手元にいくら残るのか、住み替えはどう進めるのか、どんな書類が必要か。売る前に知っておきたいことを順番にまとめました。
  本文:
    - 家を売るときは、「いくらで売れるか」よりも「手元にいくら残るか」で考えるのが大切です。売れた価格から、仲介手数料・印紙税・登記の費用、住宅ローンの残り、利益が出たときの税金などが差し引かれるため、思っていたより手元に残らないことがあります。
    - 住み替えの場合は、今の家を売るのと新しい家を買うのが同時に進みます。先に売るか、先に買うかで、仮住まいの費用やローンの組み方が変わります。売却のタイミングと次の住まいのお金を、まとめて確かめておくと安心です。
    - このガイドでは、手元に残るお金を知る → 進め方を決める → 書類と手続きを準備する、の順にまとめました。売却シミュレーターで出した手取りは、そのままライフプラン診断に入れて、住み替え後の家計まで続けて確かめられます。
  手順:
    - 見出し: 手元に残るお金を知る
      説明: 売れた価格から、仲介手数料・税金・ローンの残りなどを差し引いた「手取り」で考えるのが大切です。
      ツール: [souba, sell, chukai]
      記事: [sell-cost]
    - 見出し: 進め方を決める
      説明: 売り先行か買い先行か、査定をどこに頼むか。住み替えの進め方で、資金計画が変わります。
      ツール: []
      記事: [urisaki-kaisaki, satei-erabikata]
    - 見出し: 書類と手続きを準備する
      説明: 買ったときの書類は、税金の計算にも使います。早めにそろえておきましょう。
      ツール: []
      記事: [sell-shorui]
souzoku:
  タイトル: 相続と実家のガイド
  検索タイトル: 相続と実家のガイド｜生前の準備・手続きの期限・空き家
  カテゴリ: 相続
  イラスト: souzoku
  リード: 元気なうちの準備から、亡くなったあとの手続きの期限、相続した実家をどうするかまで。相続でつまずきやすいところを順番にまとめました。
  本文:
    - 相続は、いつ起きるかわからないうえに、起きてからは期限のある手続きが続きます。相続放棄は3か月以内、相続税の申告は10か月以内、相続登記は3年以内です。元気なうちに家族で話しておくことが、いちばんの準備になります。
    - 相続の準備で最初に確かめたいのは、「誰が相続人になるか」「財産がどれくらいあって、相続税がかかりそうか」「実家をどうするか」の3つです。とくに実家は、持ち続ける・貸す・売るで、かかるお金も手間も大きく変わります。
    - このガイドでは、相続の前にできる準備、相続が起きたあとの手続き、相続した実家の考え方を順番にまとめました。それぞれの段階で使えるツールで、相続税がかかるかの目安や、実家を持ち続けた場合の費用を計算できます。
  手順:
    - 見出し: 元気なうちに準備する
      説明: 財産の把握や家族との話し合いは、早いほど選べる方法が増えます。相続税がかかりそうかも確かめておきましょう。
      ツール: [souzoku, souzokuzei, souzokubun]
      記事: [souzokuzei-check]
    - 見出し: 亡くなったあとの手続き
      説明: 相続放棄は3か月、相続税の申告は10か月など、期限のある手続きがあります。銀行口座の凍結にも注意が必要です。
      ツール: [souzoku2]
      記事: [yokin-touketsu, souzoku-touki]
    - 見出し: 相続した実家をどうするか
      説明: 持ち続ける・貸す・売るで、かかるお金は大きく変わります。売るなら3,000万円の特例の期限にも気をつけましょう。
      ツール: [akiya]
      記事: [jikka-souzoku, akiya-3000, oya-tochi]
money:
  タイトル: これからのお金のガイド
  検索タイトル: これからのお金のガイド｜家計の見通し・教育費・老後資金
  カテゴリ: ライフプラン
  イラスト: money
  リード: 教育費・老後資金・資産づくり。家族のこれからのお金を、95歳まで見通すための考え方とツールをまとめました。
  本文:
    - 家計のこれからを考えるときは、毎月の収支だけでなく、何年も先までのお金の流れを見ることが大切です。子どもの教育費、住宅ローンの返済、車の買い替え、老後の生活費など、大きな支出は時期がずれて重なってきます。
    - ライフプラン診断では、家族・収入・住まい・教育費などを入れると、95歳までの金融資産の推移を年ごとに計算します。どの年にお金が足りなくなりそうか、どこを変えれば間に合うかを、数字で確かめられます。
    - このガイドでは、家計の見通しを立てる → 教育費に備える → 資産をつくる → 税金の仕組みを使う、の順にまとめました。まずライフプラン診断で全体を見てから、気になるところを記事やツールで深掘りする使い方がおすすめです。
  手順:
    - 見出し: 家計の見通しを立てる
      説明: 収入・支出・住まい・教育費を入れて、95歳までのお金の流れを確かめます。
      ツール: [lifeplan]
      記事: [rougo-shikin]
    - 見出し: 教育費に備える
      説明: 進路によって教育費は大きく変わります。使う時期が決まっているお金なので、早めの準備が安心です。
      ツール: []
      記事: [kyouikuhi]
    - 見出し: 資産をつくる
      説明: NISAとiDeCoの違いを知って、家計に合った使い方を考えましょう。
      ツール: []
      記事: [nisa-ideco]
    - 見出し: 税金の仕組みを使う
      説明: ふるさと納税や住宅ローン控除は、上限や手続きを知っておくと、使い損ねを防げます。
      ツール: [furusato, koujo]
      記事: [furusato-loan-koujo]
