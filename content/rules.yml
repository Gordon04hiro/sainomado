# ==============================================================
#  制度・数値データ（年に1回見直す場所）
#  ここを書き換えて保存すると、すべてのツールに反映されます。
#  金額の単位はすべて「万円」です。日付は 2027-03-31 の形で書きます。
# ==============================================================

checked: 2026-11-15     # 最後に確認した日
next: 2027-04-01        # 次に見直す予定の日

# ---- 教育費（年額・万円）----
# 出典：文部科学省「子供の学習費調査」（令和5年度）、日本政策金融公庫「教育費負担の実態調査」（令和3年度）
edu:
  kg:  { pub: 18.5,  pri: 34.7 }     # 幼稚園（公立・私立）
  sho: { pub: 33.6,  pri: 182.8 }    # 小学校
  chu: { pub: 54.2,  pri: 156.0 }    # 中学校
  ko:  { pub: 59.8,  pri: 103.0 }    # 高校
  uni:   { pub: 103.5, pri_b: 152.0, pri_r: 183.2 }   # 大学の在学費用（国公立・私立文系・私立理系）
  uniIn: { pub: 67.2,  pri_b: 81.8,  pri_r: 88.8 }    # 大学の入学費用（1年目だけ）
  away: 95.8      # 一人暮らしの仕送り（年額）
  awayIn: 38.7    # 一人暮らしを始める費用（1年目だけ）

# ---- 児童手当（年額・万円）----
allowance:
  u3: 18      # 3歳未満（月1.5万円）
  std: 12     # 3歳〜高校生（月1万円）
  third: 36   # 第3子以降（月3万円）

# ---- 売買契約書の印紙税（軽減税率）----
# [契約金額の上限, 税額] の順。いちばん下の上限 null は「それ以上すべて」
stamp:
  - [50, 0.02]
  - [100, 0.05]
  - [500, 0.1]
  - [1000, 0.5]
  - [5000, 1]
  - [10000, 3]
  - [50000, 6]
  - [null, 16]
stampUntil: 2027-03-31    # 軽減税率の期限

# ---- 仲介手数料 ----
fee:
  lowMax: 800     # この価格以下は「低廉な空家等」の特例が使える
  lowCap: 33      # 特例の上限（税込）
  tax: 0.10       # 消費税率

# ---- 譲渡所得の税率など ----
tax:
  long: 0.20315       # 長期譲渡（所有5年超）
  short: 0.39630      # 短期譲渡（所有5年以下）
  reduced: 0.14210    # 軽減税率（所有10年超のマイホーム）
  reducedCap: 6000    # 軽減税率が使える上限
  ded: 3000           # 3,000万円特別控除

kaikaeUntil: 2027-12-31     # 特定のマイホーム買い替え特例の期限
akiyaUntil: 2027-12-31      # 相続空き家の3,000万円特例の期限
akiyaDed: [3000, 2000]      # 相続空き家の特例の控除額（相続人2人以下, 3人以上）
toukiTransition: 2027-03-31 # 2024年4月より前の相続の相続登記の期限
# ---- 退職金・共済金の税金（ライフプラン診断の「退職金の手取りを計算」で使用）----
# 出典：国税庁「No.1420 退職手当等を受けたとき」「No.2260 所得税の税率」
# 退職所得控除：勤続20年まで1年d1万円、20年超は1年d2万円（最低min万円）。退職所得＝（収入−控除）×1/2
# brackets は [課税所得の上限(万円), 税率(%), 控除額(万円)]（所得税の速算表）。fukko は復興特別所得税(%)、res は住民税(%)
retire:
  d1: 40
  d2: 70
  min: 80
  fukko: 2.1
  res: 10
  brackets: [[195, 5, 0], [330, 10, 9.75], [695, 20, 42.75], [900, 23, 63.6], [1800, 33, 153.6], [4000, 40, 279.6], [999999, 45, 479.6]]

# ---- 給与の税金のざっくり計算（住宅ローン控除の目安で「年収から目安を入れる」ときに使用）----
# 出典：国税庁「No.1410 給与所得控除」「No.1199 基礎控除」（令和7年分以降）
# ded は [年収の上限(万円), 年収に掛ける割合(%), 足す額(万円)]。給与所得控除＝年収×割合＋足す額（最低 min 万円）
# social は社会保険料の目安（年収に対する%）、basic は基礎控除（万円）。扶養控除などは考えない
salary:
  min: 74            # 給与所得控除の最低額（2026・2027年分は本則69万円＋特例5万円）
  ded: [[190, 0, 65], [360, 30, 8], [660, 20, 44], [850, 10, 110], [999999, 0, 195]]
  social: 15
  # 所得税の基礎控除（2026年分）：[合計所得金額の上限（万円）, 控除額（万円）]。489万円以下・655万円以下は2026・2027年分の特例を含む
  basic: [[489, 104], [655, 67], [2350, 62], [2400, 48], [2450, 32], [2500, 16], [999999, 0]]

# ---- ふるさと納税の控除上限の目安（「ふるさと納税の上限の目安」ツールで使用）----
# 出典：総務省 ふるさと納税ポータル「税金の控除について」、国税庁 No.1150・No.1180・No.1191、各市町村の住民税の案内
# 上限＝住民税の所得割額×20%÷（90%−所得税率×1.021）＋2,000円（全額控除される寄附額の目安）
# resBasic：住民税の基礎控除。spouse/dep/tok は [所得税, 住民税] の控除額（万円）。adj は調整控除のざっくり額（万円）
furusato:
  resBasic: 43
  resRate: 10
  special: 20
  adj: 0.25
  spouse: [38, 33]
  dep: [38, 33]
  tok: [63, 45]

# ---- 住宅ローン金利の目安（住宅ローン・購入予算診断の「金利のタイプ」で使用）----
# 2026年11月時点の主要銀行・フラット35の水準の目安（毎月変わるので、年に数回見直す）
# 出典：各銀行・住宅金融支援機構の公表金利、ダイヤモンド不動産研究所・モゲチェックの2026年11月の金利まとめ
loanRates:
  asOf: "2026年11月"
  hendo: 1.5
  kotei10: 3.8
  flat: 3.8

# ---- 公的年金（ライフプラン診断の「年金の目安を計算する」で使用）----
# 出典：日本年金機構・厚生労働省（令和8年度の年金額）
pension:
  basic: 7.0608   # 老齢基礎年金の満額（月額・万円）。令和8年度 70,608円
  rate: 5.481     # 厚生年金（報酬比例部分）の乗率（1000分の5.481）
  incCap: 1080    # 計算に使う年収の上限（標準報酬月額65万円×12＋賞与150万円×2）
  take: 0.9       # 手取りの目安（税金・社会保険料を約10%差し引く）

# ---- 医療費（病気・けがの備え診断で使用）----
# 出典：厚生労働省「高額療養費制度」（令和8年8月からの自己負担限度額・69歳以下）、港区「令和8年8月から高額療養費の自己負担限度額が変わります」
# kougaku の各区分：[区分名, 年収の目安の上限(万円), 基本額(円), 基準となる医療費(円), 多数回該当(円), 年間上限(万円)]（基準額0は定額）
iryou:
  kougaku:
    - [ア, 99999, 270300, 901000, 140100, 168]
    - [イ, 1160, 179100, 597000, 93000, 110]
    - [ウ, 770, 85800, 286000, 44400, 53]
    - [エ, 370, 61500, 0, 44400, 53]
  meal: 510          # 入院中の食事（1食・円。標準負担額）
  dayMed: 5          # 入院1日あたりの医療費の総額の目安（万円・10割）
  shoubyou: 0.6667   # 傷病手当金（標準報酬日額の3分の2）
  shoubyouMonths: 18 # 傷病手当金の期間（通算1年6か月）
  social: 0.15       # 休んでいる間も払う社会保険料（額面に対する割合の目安）
  take: 0.78         # 手取りの目安（額面に対する割合）

# ---- 遺族年金（必要保障額の目安で使用）----
# 出典：日本年金機構「遺族年金」（令和8年度の額）、厚生労働省「年金制度改正法（令和7年法律第74号）」
# 金額は年額・万円。kidNew は2028年4月からの子の加算（2024年度価格28.17万円を令和8年度の水準に置き換えた目安）
izoku:
  basic: 84.73      # 遺族基礎年金（847,300円）
  kid12: 24.38      # 子の加算 1人目・2人目（243,800円）
  kid3: 8.13        # 子の加算 3人目以降（81,300円）
  kidNew: 29.25     # 2028年4月から：子の加算を一律に（目安）
  chukou: 63.55     # 中高齢寡婦加算（遺族基礎年金の3/4）
  reform: 2028      # 遺族厚生年金の見直し（有期給付化など）の施行年
  months: 300       # 加入期間が短いときは300月とみなす
  boost: 1.3        # 2028年4月からの有期給付加算（有期の間はおおむね1.3倍）
  contLoW: 204      # 5年後の継続給付が全額出る収入の目安（妻・寡婦に当たる場合、年収・万円）
  contLoH: 132      # 同（夫など）
  contHi: 360       # 継続給付が止まる収入の目安（月30万円）

# ---- 住宅ローン控除（2026〜2030年入居）----
# 出典：財務省「令和8年度税制改正の大綱」、国土交通省「住宅ローン減税」
# 借入限度額は [一般, 子育て世帯・若者夫婦世帯]（万円）。years は控除期間（年）
koujo:
  rate: 0.7            # 控除率（%）
  residentCap: 9.75    # 住民税から控除できる上限（万円/年）
  residentRate: 5      # 住民税から控除できる上限（課税所得の%）
  types:
    new_cert:  { name: 新築・長期優良住宅／低炭素住宅, limit: [4500, 5000], years: 13 }
    new_zeh:   { name: 新築・ZEH水準省エネ住宅, limit: [3500, 4500], years: 13 }
    new_eco:   { name: 新築・省エネ基準適合住宅, limit: [2000, 3000], years: 13, until: 2027 }
    used_cert: { name: 中古・長期優良住宅／低炭素住宅／ZEH水準, limit: [3500, 4500], years: 13 }
    used_eco:  { name: 中古・省エネ基準適合住宅, limit: [2000, 3000], years: 13 }
    used_other: { name: 中古・その他の住宅, limit: [2000, 2000], years: 10 }

karibarai: 150              # 預貯金の仮払い制度の上限（1金融機関あたり）
screenRate: 3.0             # 住宅ローンの審査金利の目安（%）

# ---- 仲介手数料（売買の媒介報酬）の上限（「仲介手数料の計算」ツールで使用）----
# 出典：国土交通省「宅建業者が受け取る報酬額について」（報酬告示）、令和6年7月1日施行の低廉な空家等の特例
# tiers：[この金額まで（万円）, 料率%]。価格は消費税を含まない額。tax は消費税率%
chukai:
  tiers: [[200, 5], [400, 4], [999999, 3]]
  tax: 10
  lowPrice: 800        # 低廉な空家等の特例の対象（物件価格がこの額以下）
  lowCap: 30           # 特例の上限（万円・税抜）。税込は33万円

# ---- 贈与税（「住宅資金の贈与税の目安」ツールで使用）----
# 出典：国税庁 No.4408（暦年課税の速算表）、No.4508（住宅取得等資金の非課税）、No.4103・No.4503（相続時精算課税）
# 速算表は [基礎控除後の課税価格の上限（万円）, 税率%, 控除額（万円）]
zoyo:
  basic: 110
  general: [[200,10,0],[300,15,10],[400,20,25],[600,30,65],[1000,40,125],[1500,45,175],[3000,50,250],[999999,55,400]]
  special: [[200,10,0],[400,15,10],[600,20,30],[1000,30,90],[1500,40,190],[3000,45,265],[4500,50,415],[999999,55,640]]
  houseLimit: { eco: 1000, other: 500 }   # 住宅取得等資金の非課税限度額（省エネ等住宅／それ以外）
  houseUntil: "2026年12月31日"            # 非課税の特例の対象になる贈与の期限
  seisan: { special: 2500, basic: 110, rate: 20 }   # 相続時精算課税
