# サイト全体の設定
url: https://sainomado.jp     # サイトのアドレス（最後に / は付けない）
name: サイのまど｜住まいとお金の無料シミュレーション
shortName: サイのまど                          # 検索結果に出してほしいサイト名
sameAs: [https://x.com/sainomado, https://www.instagram.com/sainomado/]                                      # 公式のSNSなど（XやInstagramのプロフィールのURL）。Googleに「同じ運営者」と伝える
altNames: [さいのまど, サイノマド, sainomado]     # 「さいのまど」などで探されたときのための別名
contactForm: "https://docs.google.com/forms/d/e/1FAIpQLSfJuvud4JCL3M9MJ5PTbYuTm9Rg05zVdsF_b8DD7D5koEXONQ/viewform"               # GoogleフォームのURLを入れると、お問い合わせボタンが有効になります
analytics: "G-78NZTT9650"                 # GoogleアナリティクスのID（G-XXXXXXX）を入れると計測が始まります
adsense: "ca-pub-8266994171904800"                   # AdSenseの審査が通ったら、パブリッシャーID（ca-pub-XXXX）を入れます

# 運営者のプロフィール（「サイトについて」と各記事の執筆者欄に出ます。本名・会社名は出しません）
運営者:
  名前: サイのまど運営者
  資格:               # 1つ目が記事の「執筆・監修」欄に出ます
    - 宅地建物取引士
    - 管理業務主任者
    - 賃貸住宅メンテナンス主任者
    - 相続診断士
    - 土地活用プランナー
    - リノベーションコーディネーター
  実務年数: "4年"     # 運営者本人の実務年数（空欄なら表示しません）
  会社の年数: "13年"   # 所属する不動産会社の業歴（空欄なら表示しません）
  地域: 静岡県西部
  相続の相談: true    # true なら「相続の相談にも対応」と表示

# 自社の広告（KJプランニング株式会社のバナー）。出す: false にすると全ページから消えます
# ページの内容に合わせて、3種類のバナーを出し分けます（画像は static/ads/kj-テーマ-wide/rect.webp。横長＝PC、四角＝スマホ）
#   re＝不動産（売却・売買のご仲介・賃貸・管理）、souzoku＝相続（相続した不動産・空き家・専門家のご紹介）、lp＝ライフプラン（ライフプラン・資金計画・家づくり）
# リンクには、どのページから来たかがわかるように utm パラメータを自動で付けます（会社のホームページのGA4で見られます）
自社広告:
  出す: true
  名前: KJプランニング株式会社
  リンク: https://www.kjplanning.co.jp/
  テーマ:
    re:
      説明: 不動産の売却・購入・賃貸のご相談
      ツール: [souba, sell, chukai, zoyo, akiya, loan, rent2buy, vs, chuko]
      記事カテゴリ: [家を売る, 家を買う]
      ガイド: [sell, buy]
    souzoku:
      説明: 相続した不動産・空き家のご相談
      ツール: [souzoku, souzoku2, souzokuzei, souzokubun]
      記事カテゴリ: [相続]
      ガイド: [souzoku]
    lp:
      説明: ライフプラン・資金計画・家づくりのご相談
      ツール: [lifeplan, hoshou, iryou, prepay, koujo, furusato]
      記事カテゴリ: [ライフプラン]
      ガイド: [money]

# AdSenseの「広告ユニット」の番号（data-ad-slot の数字）。空欄の枠には何も出ません。
# AdSenseの管理画面 → 広告 → 広告ユニットごと → ディスプレイ広告 で作り、数字だけを貼ります。
# どの枠もスマホ・PCの両方で、画面の幅に合わせた大きさで表示されます。
adslots:
  記事の上: ""      # 記事のリード文のすぐ下
  記事の中: ""      # 記事の途中（見出し2つごと・何か所でも）
  記事の下: ""      # 記事の終わり
  ツールの下: ""    # 各ツールのページの下（計算結果の下）
  一覧の中: ""      # トップページ・記事一覧の途中
