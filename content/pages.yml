# ページごとの「検索結果に出るタイトル」と「説明文」です。
# 説明文は 80〜120 文字くらいが目安です。
home:
  file: index.html
  title: サイのまど｜住まいとお金の無料シミュレーション（売却・住宅ローン・相続・ライフプラン）
  description: 家を買う・売る・相続する前に、お金の見通しを。サイのまど（さいのまど）は、登録不要で使えるライフプラン診断、売却相場の目安、売却・住み替え、住宅ローン、相続のチェックシートなど17の無料ツールのサイトです。
lifeplan:
  file: lifeplan.html
  title: ライフプランシミュレーション無料｜キャッシュフロー表を作成（Excel・PDF保存）｜サイのまど
  description: 家を買う、車を買い替える、保険に入る、生活費を見直す。家族・収入・住まい・資産を入れると、95歳までのキャッシュフロー表と家計のバランスシートを作成し、最大3パターンで比べられます。Excel・PDFで保存。登録不要・無料。
sell:
  file: sell.html
  title: 家の売却 手取りシミュレーション｜住み替え・税金も計算｜サイのまど
  description: 仲介手数料・印紙代・税金の計算例を差し引いた手取りと、ローンを返し切れる売却価格、住み替え後のローン返済額を計算。3,000万円控除・買い替え特例・800万円以下の特例に対応。
loan:
  file: loan.html
  title: 住宅ローン借入可能額シミュレーション｜年収から予算を計算｜サイのまど
  description: 年収と頭金から、無理なく返せる借入額と審査で借りられる上限の目安、物件価格の目安を計算。金利が上がった場合の返済額も確認できます。
rent2buy:
  file: rent2buy.html
  title: 家賃と同じ返済で買える家はいくら？｜家賃から物件価格を計算｜サイのまど
  description: 今の家賃と同じ月々の負担で買える物件価格を計算。管理費・修繕費・固定資産税も差し引いて考えます。金利や家賃を変えた早見表つき。登録不要。
prepay:
  file: prepay.html
  title: 繰上げ返済シミュレーター｜期間短縮と返済額軽減、どちらが得？｜サイのまど
  description: 住宅ローンを繰上げ返済したときに減る利息を、期間短縮型と返済額軽減型で比較。短くなる期間や毎月の返済の変化もわかります。登録不要。
souzokuzei:
  file: souzokuzei.html
  title: 相続税がかかるか簡単チェック｜基礎控除を計算｜サイのまど
  description: 預貯金・自宅・生命保険などの財産の合計が、相続税の基礎控除（3,000万円＋600万円×法定相続人の数）を超えそうかを確認。税額は計算しない、かんたんなチェックです。
zoyo:
  file: zoyo.html
  title: 住宅資金の贈与税シミュレーション｜親からの援助は非課税？｜サイのまど
  description: 親や祖父母から家の購入資金を援助してもらうときの贈与税を計算。住宅取得等資金の非課税（最大1,000万円）、暦年課税の基礎控除110万円、相続時精算課税の3つを比べられます。登録不要・入力は送信されません。
matome:
  file: matome.html
  noindex: true
  title: わが家のまとめ｜サイのまど
  description: サイのまどのツールで計算した結果を1枚にまとめて、印刷・PDFにできます。入力はこの端末の中だけに保存されます。
souba:
  file: souba.html
  title: 売却相場の目安（国の取引データから無料で）｜サイのまど
  description: 国土交通省の不動産取引価格・成約価格（直近5年）から、市区町村・種類・広さ・築年数が近い物件の相場の幅を出します。登録不要・入力は送信されません。
chukai:
  file: chukai.html
  title: 仲介手数料の計算｜売買価格から上限額を自動計算（早見表つき）｜サイのまど
  description: 家を売る・買うときの仲介手数料の上限額を、物件価格から自動で計算。3%＋6万円の速算式や消費税込みの金額、800万円以下の物件の特例（上限33万円）もわかります。登録不要・入力は送信されません。
furusato:
  file: furusato.html
  title: ふるさと納税の上限シミュレーション｜年収・家族構成から簡単計算｜サイのまど
  description: 年収と家族構成（配偶者・扶養）から、ふるさと納税で自己負担2,000円で済む寄附額の上限の目安を計算。住宅ローン控除・iDeCoを使っている場合の注意も。登録不要・入力は送信されません。
koujo:
  file: koujo.html
  title: 住宅ローン控除シミュレーション｜いくら戻る？年ごとの目安｜サイのまど
  description: 借入額・金利・家の種類（長期優良・ZEH・省エネ・中古）から、住宅ローン控除で毎年いくら戻るかの目安を計算。所得税・住民税の上限も考えます。2026〜2030年入居の制度に対応。登録不要。
souzokubun:
  file: souzokubun.html
  title: 法定相続分の計算ツール｜相続の割合と遺留分がわかる｜サイのまど
  description: 配偶者・子ども・親・兄弟姉妹の人数を入れると、法定相続分と遺留分の割合、財産の合計に当てはめた金額の目安がわかります。登録不要・入力は送信されません。
chuko:
  file: chuko.html
  title: 中古住宅チェックリスト｜内見・購入前に確かめる19項目｜サイのまど
  description: 再建築不可・旧耐震・市街化調整区域・私道・浄化槽・擁壁など、中古住宅を買う前に確かめたいポイントをチェックリストに。まだ確かめていないことが一覧になります。登録不要。
links:
  file: links.html
  noindex: true
  title: 住まいとお金の一次情報リンク集｜国・自治体の公式情報｜サイのまど
  description: 住宅ローン控除、補助金、税金、相続、ハザードマップなど、住まいとお金に関する国・自治体の公式情報へのリンク集です。
glossary:
  file: glossary.html
  title: 住まいとお金の用語集｜住宅ローン・売却・相続の言葉をやさしく解説｜サイのまど
  description: 返済負担率、取得費、路線価、法定相続分など、家を買う・売る・相続するときに出てくる言葉を、短くやさしく説明します。
souzoku:
  file: souzoku.html
  title: 相続の準備チェックシート（遺す方へ）｜サイのまど
  description: 財産の把握、家・土地の名義、遺言、家族との話し合いなど、相続の準備がどこまでできているかを12問で確認。これからやることのリストがわかります。
souzoku2:
  file: souzoku2.html
  title: 相続の手続きチェックシート（受け継ぐ方へ）期限の一覧つき｜サイのまど
  description: 亡くなった日を入れると、死亡届・相続放棄・相続税・相続登記など20の手続きの期限日と残り日数を一覧に。銀行口座の凍結や解約の手続きも。
akiya:
  file: akiya.html
  title: 相続した空き家シミュレーション｜売る・貸す・持つを比較｜サイのまど
  description: 相続した家を「そのまま持つ」「貸す」「建物つきで売る」「解体して土地で売る」の4つで、10年間のお金の出入りを比較。相続登記の義務化や空き家の特例も解説。
vs:
  file: vs.html
  title: 賃貸と持ち家どっちが得？生涯の住居費シミュレーション｜サイのまど
  description: 今の年齢から85歳までの住居費の合計を、賃貸と購入（戸建て・マンション）で比較。最後に残る家の価値も差し引いて比べます。
articles:
  file: articles/index.html
  title: 記事一覧｜住まいとお金の基本｜サイのまど
  description: 家を買う・売る・相続する前に知っておきたい、住まいとお金の基本をまとめた記事の一覧です。
news:
  file: news.html
  noindex: true
  title: お知らせ｜サイのまど
  description: サイのまどの更新情報です。
data:
  file: data.html
  title: 使っているデータ｜サイのまど
  description: サイのまどのツールが計算に使っている制度・数値と、その出典・見直し時期の一覧です。
fptool:
  file: fptool.html
  title: 無料のFPツール｜自分でできるライフプラン・キャッシュフロー表｜サイのまど
  description: FPが家計の相談で使うライフプラン表・キャッシュフロー表を、自分で無料で作れます。質問に答えるだけ、登録不要。95歳までの収支と貯蓄、夫婦別のNISA・iDeCo・年金、家を買う・買わないの比較も。入力内容は送信されません。
about:
  file: about.html
  title: サイトについて｜サイのまど
  description: サイのまど（さいのまど）は、住まいとお金の決断を自分の数字で確かめる「家計のセカンドオピニオン」。なぜ作ったのか、大切にしていること、運営者（宅地建物取引士）について。
privacy:
  file: privacy.html
  title: プライバシーポリシー｜サイのまど
  description: サイのまどのプライバシーポリシーです。
