# お知らせ。新しいものを一番上に足します。

- 日付: '2026-11-27'
  内容: 「病気・けがの備え診断」を公開しました。入院や休職のときの医療費の自己負担（高額療養費の2026年8月からの限度額・年間上限）と、傷病手当金を入れた収入の減り方を計算し、貯蓄で足りるかを確かめられます。
- 日付: '2026-11-27'
  内容: 「必要保障額の目安」を公開しました。遺族年金（令和8年度の額・2028年4月からの見直し）、配偶者の収入、教育費、住まい（団信）から、もしものときに家族に必要なお金を1年ずつ計算します。あわせて、すべてのツールに「名前を付けて保存」を付け、わが家のまとめのPDFでは入れるツールを選べるようにしました。
- 日付: '2026-11-26'
  内容: 「売却相場の目安」を公開しました。国土交通省の不動産情報ライブラリとAPIでつなぎ、全国の実際の取引価格から、市区町村・町名ごとの相場の幅、2010年からの推移、近くの地価公示・地価調査の価格を確かめられます。登録不要で、入力した内容は送信されません。
- 日付: '2026-11-17'
  内容: サイト名を「サイのまど」に変えました。「まど」は、住まいの窓と、相談の窓口から。ロゴは、家の中にいるサイの貯金箱です。これからもよろしくお願いします。
- 日付: '2026-11-15'
  内容: ライフプラン診断に「家計の決算書（BS・PL）」「目標から逆算」「シナリオ比較」「予算と実績」を追加しました。PDF・Excelでの保存にも対応しました。
- 日付: '2026-11-14'
  内容: 相続の手続きチェックシート（受け継ぐ方へ）、相続した家・空き家の診断、住宅ローン・購入予算診断、賃貸vs持ち家 比べる診断を公開しました。
- 日付: '2026-11-13'
  内容: サイトを公開しました。まずはライフプラン診断と、売却・住み替えシミュレーターから。
