# 「使っているデータ」ページに載せる一覧です。
# 期限：rules.yml の期限の名前（stampUntil など）を書くと、期限日と「期限切れ」表示が自動で出ます。

- カテゴリ: ライフプラン
  項目: 教育費（幼稚園〜高校）
  値: 公立・私立別の学年平均（例：公立小学校 年33.6万円、私立小学校 年182.8万円）
  出典: 文部科学省「子供の学習費調査」（令和5年度）
  使うツール: ライフプラン診断
- カテゴリ: ライフプラン
  項目: 教育費（大学・一人暮らし）
  値: 国公立 年103.5万円、私立文系 年152.0万円、私立理系 年183.2万円、仕送り 年95.8万円など
  出典: 日本政策金融公庫「教育費負担の実態調査結果」（令和3年度）
  リンク: https://www.jfc.go.jp/n/release/pdf/topics_211220a.pdf
  使うツール: ライフプラン診断
- カテゴリ: ライフプラン
  項目: 児童手当
  値: 3歳未満 月1.5万円、3歳〜高校生 月1万円、第3子以降 月3万円（所得制限なし）
  出典: こども家庭庁（2024年10月からの制度）
  使うツール: ライフプラン診断
- カテゴリ: ライフプラン
  項目: 公的年金の目安
  値: 老齢基礎年金の満額 月70,608円（令和8年度）。厚生年金は平均年収×5.481/1000×加入年数で計算し、手取りは額面の約9割として計算
  出典: 日本年金機構「令和8年度の年金額」、厚生労働省
  リンク: https://www.nenkin.go.jp/
  使うツール: ライフプラン診断
- カテゴリ: 家を買う
  項目: 住宅ローン控除（2026〜2030年入居）
  値: 控除率0.7%。借入限度額は新築の長期優良住宅4,500万円（子育て世帯等5,000万円）、ZEH水準3,500万円（4,500万円）、省エネ基準適合2,000万円（3,000万円・2027年入居まで）、中古の省エネ住宅など。控除期間は13年（中古のその他は10年）
  出典: 財務省「令和8年度税制改正の大綱」、国土交通省「住宅ローン減税」
  リンク: https://www.mlit.go.jp/jutakukentiku/house/zeisei_index2.html
  使うツール: 住宅ローン控除の目安
- カテゴリ: 相続
  項目: 法定相続分・遺留分
  値: 配偶者と子は1/2ずつ、配偶者と親は2/3と1/3、配偶者と兄弟姉妹は3/4と1/4。遺留分は全体で1/2（親だけが相続人のときは1/3、兄弟姉妹にはなし）
  出典: 民法 第900条・第1042条
  使うツール: 法定相続分の計算
- カテゴリ: 売却
  項目: 不動産の取引価格・成約価格
  値: 中古マンション・戸建て・土地の実際の取引（全国約200万件、直近5年で相場の幅、2010年からで年ごとの推移）。関係者間取引・競売など特殊な取引は除外。国のAPIから四半期ごとに自動で取り込み
  出典: 国土交通省「不動産情報ライブラリ」（不動産取引価格情報・成約価格情報）をもとにサイのまどが集計・加工して作成（国が作成した数値ではありません）。このサービスは、国土交通省の不動産情報ライブラリのAPI機能を使用していますが、提供情報の最新性、正確性、完全性等が保証されたものではありません
  リンク: https://www.reinfolib.mlit.go.jp/
  使うツール: 売却相場の目安
- カテゴリ: 売却
  項目: 地価公示・都道府県地価調査
  値: 全国約4.7万地点の1㎡あたりの価格と前年比、2005年からの価格の推移（地価公示は1月1日時点、地価調査は7月1日時点。2026年分）
  出典: 「国土数値情報（地価公示データ・都道府県地価調査データ）」（国土交通省）を加工して作成
  リンク: https://nlftp.mlit.go.jp/ksj/
  使うツール: 売却相場の目安
- カテゴリ: 売却
  項目: 仲介手数料の上限
  値: 400万円超：価格×3%＋6万円（税別）。800万円以下の家・土地は、事前の合意で30万円（税別）まで
  出典: 国土交通省告示（2024年7月改正）
  使うツール: 売却・住み替え／空き家の診断
- カテゴリ: 売却
  項目: 売買契約書の印紙税（軽減税率）
  値: 1,000万円超5,000万円以下：1万円 など
  出典: 国税庁 No.7108
  リンク: https://www.nta.go.jp/taxes/shiraberu/taxanswer/inshi/7108.htm
  期限: stampUntil
  使うツール: 売却・住み替え
- カテゴリ: 売却
  項目: 譲渡所得の税率
  値: 長期（所有5年超）20.315%、短期39.63%、軽減税率（所有10年超・6,000万円以下の部分）14.21%
  出典: 国税庁 No.1440・No.3305
  リンク: https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/1440.htm
  使うツール: 売却・住み替え
- カテゴリ: 売却
  項目: 特定のマイホーム買い替え特例
  値: 居住10年以上・所有10年超・売却価格1億円以下などが要件
  出典: 国税庁 No.3355
  リンク: https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3355.htm
  期限: kaikaeUntil
  使うツール: 売却・住み替え
- カテゴリ: 相続
  項目: 相続した空き家の3,000万円特例
  値: 昭和56年5月31日以前の家。相続人3人以上は2,000万円まで
  出典: 国税庁 No.3306
  リンク: https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3306.htm
  期限: akiyaUntil
  使うツール: 空き家の診断／相続の手続きチェック
- カテゴリ: 相続
  項目: 相続登記の義務化
  値: 取得を知った日から3年以内。2024年4月1日より前の相続は2027年3月31日まで
  出典: 法務省
  期限: toukiTransition
  使うツール: 相続の手続きチェック
- カテゴリ: 相続
  項目: 預貯金の仮払い制度
  値: 1つの金融機関につき150万円まで（預金額×1/3×法定相続分が上限）
  出典: 民法909条の2
  使うツール: 相続の手続きチェック
- カテゴリ: 住宅ローン
  項目: 審査金利の目安
  値: 3.0%（銀行の審査で使われることが多い3〜4%の下限）
  出典: 当サイトの設定
  使うツール: 住宅ローン・購入予算診断
- カテゴリ: 税金
  項目: ふるさと納税の控除上限（全額控除される寄附額の目安）
  値: 住民税の所得割額×20%÷（90%−所得税率×1.021）＋2,000円。住民税の基礎控除43万円、配偶者控除33万円、扶養控除33万円（19〜22歳は45万円）で計算
  出典: 総務省 ふるさと納税ポータル「税金の控除について」
  リンク: https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/furusato/mechanism/deduction.html
  使うツール: ふるさと納税の上限の目安
- カテゴリ: 税金
  項目: 給与所得控除・基礎控除（年収から税金の目安を出すとき）
  値: 給与所得控除は最低74万円（2026年分：本則69万円＋特例5万円）。所得税の基礎控除は合計所得金額489万円以下104万円・655万円以下67万円・2,350万円以下62万円（2026年分、特例を含む）。社会保険料は年収の約15%
  出典: 国税庁 タックスアンサー No.1410 給与所得控除、No.1199 基礎控除（令和8年4月1日現在）
  リンク: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm
  使うツール: 住宅ローン控除の目安、ふるさと納税の上限の目安
- カテゴリ: 税金
  項目: 退職金の税金（退職所得）
  値: 退職所得控除は勤続20年まで1年40万円、20年超は1年70万円（最低80万円）。退職所得＝（収入−控除）×1/2
  出典: 国税庁 タックスアンサー（退職金と年金）
  リンク: https://www.nta.go.jp/taxes/shiraberu/taxanswer/code/bunya-taisyoku-nenkin.htm
  使うツール: ライフプラン診断
- カテゴリ: 住宅ローン
  項目: 住宅ローン金利の目安（金利のタイプ）
  値: 変動金利1.5%・10年固定3.8%・全期間固定（フラット35など）3.8%（2026年11月ごろの主要銀行・フラット35の水準の目安。実際の金利は金融機関や審査で変わる）
  出典: 各銀行・住宅金融支援機構の公表金利（2026年11月）
  使うツール: 住宅ローン・購入予算診断
