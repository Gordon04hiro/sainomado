# ==============================================================
#  用語集（glossary.html に表示）
#  語: 言葉 ／ 読み: よみがな ／ 分野: 家を買う・家を売る・相続・お金 ／ 説明: 1〜3文
#  関連: 記事のファイル名（.md を除く）か、ツールの名前（loan など）を1つ（なくても可）
# ==============================================================
- 語: 返済負担率
  読み: へんさいふたんりつ
  分野: 家を買う
  説明: 年収（額面）に対する、1年間のローン返済額の割合です。金融機関の審査では35%前後が上限になることが多く、無理なく返せる目安は20〜25%程度といわれます。
  関連: loan-budget
- 語: 審査金利
  読み: しんさきんり
  分野: 家を買う
  説明: 金融機関が審査のときに使う、実際より高めの金利（3〜4%程度）です。金利が上がっても返せるかを確かめるために使われます。
  関連: loan
- 語: 変動金利
  読み: へんどうきんり
  分野: 家を買う
  説明: 市場の金利に合わせて、借りたあとも金利が見直される住宅ローンです。当初の金利は低めですが、金利が上がると返済額が増えます。
  関連: hendo-kotei
- 語: 固定金利
  読み: こていきんり
  分野: 家を買う
  説明: 借りたときの金利が、完済まで（または決めた期間）変わらない住宅ローンです。返済額が変わらない安心がある一方、金利は変動金利より高めのことが多いです。
  関連: hendo-kotei
- 語: 元利均等返済
  読み: がんりきんとうへんさい
  分野: 家を買う
  説明: 毎月の返済額（元本と利息の合計）が同じになる返し方です。住宅ローンで最も一般的で、はじめは利息の割合が大きく、だんだん元本の割合が増えます。
- 語: 繰上げ返済
  読み: くりあげへんさい
  分野: 家を買う
  説明: 毎月の返済とは別に、ローンの元本の一部を前倒しで返すことです。返済期間を短くする「期間短縮型」と、毎月の返済額を減らす「返済額軽減型」があります。
  関連: prepay
- 語: 住宅ローン控除
  読み: じゅうたくろーんこうじょ
  分野: 家を買う
  説明: 住宅ローンを使って家を買ったとき、年末のローン残高の0.7%が所得税などから差し引かれる制度です。「住宅ローン減税」とも呼ばれます。
  関連: koujo
- 語: 団体信用生命保険
  読み: だんたいしんようせいめいほけん
  分野: 家を買う
  説明: 住宅ローンを借りた人が亡くなったり高度障害になったりしたときに、残りのローンが保険で返済されるしくみです。「団信」と略されます。
- 語: 諸費用
  読み: しょひよう
  分野: 家を買う
  説明: 物件の価格とは別にかかる費用です。登記費用、仲介手数料、ローンの手数料、印紙代などで、物件価格の6〜9%程度が目安です。
  関連: loan-budget
- 語: 固定資産税
  読み: こていしさんぜい
  分野: 家を買う
  説明: 毎年1月1日に土地や建物を持っている人にかかる税金です。固定資産税評価額の1.4%が標準の税率です。
  関連: koteishisanzei
- 語: 都市計画税
  読み: としけいかくぜい
  分野: 家を買う
  説明: 市街化区域にある土地や建物にかかる税金です。税率は最大0.3%で、市町村によって違います。
  関連: koteishisanzei
- 語: 仲介手数料
  読み: ちゅうかいてすうりょう
  分野: 家を売る
  説明: 不動産会社に売買の仲介を頼んだときに払う報酬です。法律で上限が決まっていて、400万円を超える取引では「価格×3%＋6万円」に消費税を加えた額が上限です。
  関連: sell-cost
- 語: 譲渡所得
  読み: じょうとしょとく
  分野: 家を売る
  説明: 家や土地を売ったときの「もうけ」のことです。売った価格から、取得費と売るときの費用を引いて計算し、この額に税金がかかります。
  関連: sell-cost
- 語: 取得費
  読み: しゅとくひ
  分野: 家を売る
  説明: 売った家や土地を買ったときの価格に、買ったときの諸費用を足した額です。建物は、持っていた年数に応じて価値の目減り分を差し引きます。わからない場合は売った価格の5%とする決まりがあります。
  関連: sell-shorui
- 語: 3,000万円特別控除
  読み: さんぜんまんえんとくべつこうじょ
  分野: 家を売る
  説明: 住んでいた家を売ったとき、譲渡所得から最高3,000万円を差し引ける特例です。使うには確定申告が必要です。
  関連: sell-cost
- 語: 査定
  読み: さてい
  分野: 家を売る
  説明: 不動産会社が「このくらいで売れそう」と考える価格を出すことです。査定額は売れる価格の予想で、その金額で買い取ってもらえるわけではありません。
  関連: satei-erabikata
- 語: 媒介契約
  読み: ばいかいけいやく
  分野: 家を売る
  説明: 家の売却を不動産会社に頼むときに結ぶ契約です。1社だけに頼む「専属専任」「専任」と、複数の会社に頼める「一般」があります。
- 語: 抵当権
  読み: ていとうけん
  分野: 家を売る
  説明: ローンを返せなくなったときに、金融機関が家や土地を売って回収できる権利です。家を売るときは、ローンを返し終えて抵当権を消す（抹消する）必要があります。
  関連: sell-cost
- 語: オーバーローン
  読み: おーばーろーん
  分野: 家を売る
  説明: 家を売った価格より、ローンの残りのほうが多い状態です。差額を預貯金などで埋めないと、ローンを返し切れません。
  関連: sell
- 語: 契約不適合責任
  読み: けいやくふてきごうせきにん
  分野: 家を売る
  説明: 引き渡した家や土地が、種類・品質・数量などの点で契約の内容と合っていなかったときに、売主が負う責任です。買主が気づいてから一定の期間内に売主へ通知する決まりがあり、その期間は契約で決めることが多いです。
- 語: 法定相続人
  読み: ほうていそうぞくにん
  分野: 相続
  説明: 民法で決められた、財産を受け継ぐ人です。配偶者は常に相続人で、ほかに子、親、兄弟姉妹の順に、先の順位の人がいなければ次の順位の人がなります。
  関連: souzokubun
- 語: 法定相続分
  読み: ほうていそうぞくぶん
  分野: 相続
  説明: 民法で決められた、相続人ごとの取り分の目安です。たとえば配偶者と子が相続人なら、配偶者が1/2、子が残りの1/2を人数で分けます。
  関連: souzokubun
- 語: 遺留分
  読み: いりゅうぶん
  分野: 相続
  説明: 遺言で取り分が少なくされても、配偶者・子・親が最低限受け取れる割合です。兄弟姉妹には遺留分がありません。
  関連: souzokubun
- 語: 遺産分割協議
  読み: いさんぶんかつきょうぎ
  分野: 相続
  説明: 遺言がない場合などに、相続人全員で財産の分け方を話し合うことです。まとまった内容は「遺産分割協議書」にします。
  関連: yokin-touketsu
- 語: 相続放棄
  読み: そうぞくほうき
  分野: 相続
  説明: 財産も借金も、いっさい受け継がないことです。原則として、相続が始まったことを知ってから3か月以内に家庭裁判所で手続きをします。
  関連: souzoku2
- 語: 相続登記
  読み: そうぞくとうき
  分野: 相続
  説明: 相続した家や土地の名義を、受け継いだ人に変える登記です。2024年4月から義務になり、知った日から3年以内に申請する必要があります。
  関連: souzoku-touki
- 語: 基礎控除（相続税）
  読み: きそこうじょ
  分野: 相続
  説明: 相続税の計算で、財産の合計から差し引ける額です。「3,000万円＋600万円×法定相続人の数」で、財産の合計がこれ以下なら相続税はかかりません。
  関連: souzokuzei
- 語: 路線価
  読み: ろせんか
  分野: 相続
  説明: 道路に面した土地の1㎡あたりの評価額で、国税庁が毎年公表しています。相続税や贈与税で土地を評価するときに使います。
  関連: souzokuzei-check
- 語: 小規模宅地等の特例
  読み: しょうきぼたくちとうのとくれい
  分野: 相続
  説明: 亡くなった人が住んでいた土地などを、配偶者や同居の家族が相続するときに、土地の評価額を最大80%減らせる特例です。使うには相続税の申告が必要です。
  関連: souzokuzei-check
- 語: 仮払い制度
  読み: かりばらいせいど
  分野: 相続
  説明: 遺産分割の前でも、相続人の1人が亡くなった人の預金の一部を引き出せる制度です。1つの金融機関あたり150万円が上限です。
  関連: yokin-touketsu
- 語: NISA
  読み: にーさ
  分野: お金
  説明: 投資で増えた分に税金がかからない国の制度です。年間360万円、生涯で1,800万円まで投資でき、いつでも引き出せます。
  関連: nisa-ideco
- 語: iDeCo
  読み: いでこ
  分野: お金
  説明: 自分で掛金を出して運用し、老後に受け取る個人型の年金です。掛金が所得控除になりますが、原則60歳まで引き出せません。
  関連: nisa-ideco
- 語: ねんきん定期便
  読み: ねんきんていきびん
  分野: お金
  説明: 毎年の誕生月に届く、年金の加入記録と見込額のお知らせです。50歳以上は将来の見込額、50歳未満はこれまでの加入実績に応じた金額が載っています。
  関連: lifeplan
- 語: 必要保障額
  読み: ひつようほしょうがく
  分野: お金
  説明: 家計を支える人が亡くなったとき、残された家族のこれからの生活に必要なお金のうち、遺族年金・残された人の収入・貯蓄などでまかなえない分です。生命保険の死亡保障をいくらにするかの目安になります。
  関連: hoshou
- 語: 遺族年金
  読み: いぞくねんきん
  分野: お金
  説明: 公的年金に入っていた人が亡くなったとき、家族が受け取れる年金です。国民年金からの遺族基礎年金（子がいる場合）と、厚生年金からの遺族厚生年金があります。2028年4月から、子のいない配偶者の遺族厚生年金が原則5年の有期給付になるなどの見直しがあります。
  関連: hoshou
- 語: 中高齢寡婦加算
  読み: ちゅうこうれいかふかさん
  分野: お金
  説明: 夫が亡くなったとき40歳以上で子のいない妻などが受け取る遺族厚生年金に、40歳から65歳になるまで加算される額です（令和8年度は年635,500円）。2028年4月から25年かけて段階的に縮小されます。
  関連: hoshou
